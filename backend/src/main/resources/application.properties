spring.application.name=forohub
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://${DB_HOST_FORO:localhost}:${DB_PORT_FORO:3306}/${DB_NAME_FORO:foro-hub}?createDatabaseIfNotExist=true&serverTimezone=UTC
spring.datasource.username=${DB_USER_FORO:root}
spring.datasource.password=${DB_PASSWORD_FORO:}
spring.profiles.active=dev, test, prod
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

logging.level.org.hibernate.SQL=ERROR
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=ERROR
logging.level.org.hibernate.type.descriptor.sql.BasicExtractor=ERROR

server.error.include-stacktrace=never

api.security.secret=${JWT_SECRET:3f8e6c7104b9015c7e1d52a20b58eef70de5e7dca8dcf7d639b7bf26ff3429fa}

spring.flyway.enabled=true
spring.flyway.url=jdbc:mysql://${DB_HOST_FORO:localhost}:${DB_PORT_FORO:3306}/${DB_NAME_FORO:foro-hub}
spring.flyway.user=${DB_USER_FORO:root}
spring.flyway.password=${DB_PASSWORD_FORO:}
spring.flyway.repair=true

spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8
spring.thymeleaf.cache=false

logging.level.org.springframework.web: DEBUG

# OpenRouter (Modelos Gratuitos con mayor cuota)
openrouter.api-key=${OPENROUTER_API_KEY:mock-key-for-tests}
openrouter.url=https://openrouter.ai/api/v1/chat/completions
openrouter.models=poolside/laguna-xs.2:free,nvidia/nemotron-3-nano-30b-a3b:free,deepseek/deepseek-r1:free,openrouter/auto

# Google Gemini (Modelos Confiables)
gemini.base-url=https://generativelanguage.googleapis.com
gemini.api-key=${GEMINI_API_KEY:mock-key-for-tests}
gemini.models=gemini-2.0-flash,gemini-1.5-flash,gemini-1.5-flash-8b
